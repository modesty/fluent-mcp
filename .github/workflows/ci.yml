name: Node.js CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch: # Allow manual triggering

jobs:
  setup:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate API specs
        run: npm run validate:specs

      - name: Validate authoring instructions
        run: npm run validate:instructs

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test
